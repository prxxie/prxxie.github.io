name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [mfe-updated]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Download MFE pre-built artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for mfe in shikaku sokoban slitherlink; do
            echo "Downloading latest dist for $mfe..."
            mkdir -p packages/$mfe/dist
            gh release download --repo prxxie/cozyos-$mfe --pattern 'dist.tar.gz' --output /tmp/$mfe-dist.tar.gz --clobber
            tar -xzf /tmp/$mfe-dist.tar.gz -C packages/$mfe/dist
          done

      - name: Run Build Script
        run: npm run build:static

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
