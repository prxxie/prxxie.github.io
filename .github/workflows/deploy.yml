name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [mfe-updated]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MFE_DOWNLOAD_TOKEN }}
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Audit dependencies (report only)
        continue-on-error: true
        run: pnpm audit --prod

  build-and-deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MFE_DOWNLOAD_TOKEN }}
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download MFE pre-built artifacts
        env:
          GH_TOKEN: ${{ secrets.MFE_DOWNLOAD_TOKEN }}
        run: |
          for mfe in shikaku sokoban slitherlink; do
            echo "Downloading latest dist for $mfe..."
            mkdir -p packages/$mfe/dist
            gh release download --repo prxxie/cozyos-$mfe --pattern 'dist.tar.gz' --output /tmp/$mfe-dist.tar.gz --clobber
            tar -xzf /tmp/$mfe-dist.tar.gz -C packages/$mfe/dist
          done

      - name: Run Build Script
        run: pnpm run build:static

      - name: Accessibility gate
        run: node scripts/a11y-gate.mjs

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: dist/a11y-report.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
